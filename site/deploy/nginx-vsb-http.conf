# Diretivas de contexto http usadas pelos sites VSB.
# Instalar em /etc/nginx/conf.d/vsb-http.conf
#
# Precisa ficar aqui, e não em snippets/: map, proxy_cache_path e
# limit_req_zone só são válidos no contexto http, enquanto o snippet
# vsb-performance.conf é incluído dentro de cada bloco server.
#
# Atenção: esta VPS também hospeda o biomie. Tudo aqui vale para todos os
# sites, então os nomes das zonas levam prefixo vsb_ e nada sobrescreve
# configuração global existente (o gzip global vive em nginx.conf).

# WebSocket: emite "upgrade" só quando o cliente pede upgrade, senão "close".
# Antes o site enviava Connection: upgrade em toda requisição, o que atrapalha
# o reaproveitamento de conexões keep-alive com o backend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache das respostas do WordPress. Protege o CMS de picos e tira o custo de
# revalidação do caminho do visitante.
proxy_cache_path /var/cache/nginx/vsb-cms
    levels=1:2
    keys_zone=vsb_cms:16m
    max_size=512m
    inactive=60m
    use_temp_path=off;

# Rate-limit da tela de login do WordPress: 20 tentativas por minuto por IP.
limit_req_zone $binary_remote_addr zone=vsb_wp_login:10m rate=20r/m;
