# Compressão para os sites VSB.
# Instalar em /etc/nginx/snippets/vsb-performance.conf
# Incluído DENTRO de cada bloco server (não no contexto http).
#
# Brotli exige os módulos:
#   apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
# Se eles não estiverem carregados, comente o bloco brotli — o gzip abaixo
# funciona sozinho.

brotli on;
brotli_comp_level 5;
brotli_static on;
brotli_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/woff2;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/woff2;
