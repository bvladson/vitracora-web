# WordPress headless (API + painel administrativo).
# Instalar em /etc/nginx/sites-available/cms.vsbseguranca.com.br
#
# Depende de /etc/nginx/conf.d/vsb-http.conf, que define a zona de cache
# vsb_cms e a zona de rate-limit vsb_wp_login.

server {
    server_name cms.vsbseguranca.com.br;
    include /etc/nginx/snippets/vsb-performance.conf;

    client_max_body_size 32m;
    access_log /var/log/nginx/vsb-cms-access.log;
    error_log /var/log/nginx/vsb-cms-error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Enumeração de usuários --------------------------------------------
    # O site público consome posts, páginas, CPTs e produtos. Nunca /users.
    # Esse endpoint entregava o login do superadministrador.
    location ~* ^/wp-json/wp/v2/users {
        return 404;
    }
    location ~* ^/author/ {
        return 404;
    }

    # ---- Superfícies que o modo headless não usa ---------------------------
    location = /xmlrpc.php {
        deny all;
        access_log off;
    }

    location ~* /(?:\.env|wp-config\.php|readme\.html|license\.txt|wp-config-sample\.php)$ {
        deny all;
    }

    # Nada de PHP executável a partir de uploads.
    location ~* ^/wp-content/uploads/.*\.(?:php|phtml|php[0-9])$ {
        deny all;
    }

    # ---- Painel: rate-limit ------------------------------------------------
    # Para travar por IP, descomente allow/deny e ajuste o endereço.
    location = /wp-login.php {
        limit_req zone=vsb_wp_login burst=5 nodelay;

        # allow 203.0.113.10;   # <- seu IP fixo, se houver
        # deny all;

        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ---- Uploads: cache longo ----------------------------------------------
    # As imagens do catálogo vinham sem nenhum Cache-Control, então o
    # navegador as rebaixava a cada visita a /produtos.
    location ^~ /wp-content/uploads/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache vsb_cms;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---- API REST: cache curto com revalidação em segundo plano ------------
    location ^~ /wp-json/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;

        # Só GET/HEAD entram no cache: o POST de leads passa direto.
        proxy_cache vsb_cms;
        proxy_cache_valid 200 5m;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        # Requisições autenticadas nunca são servidas do cache.
        proxy_cache_bypass $http_authorization $cookie_wordpress_logged_in;
        proxy_no_cache $http_authorization $cookie_wordpress_logged_in;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # http2 é habilitado na socket 443 pelo bloco de vsbseguranca.com.br;
    # repetir aqui daria "duplicate listen options".
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cms.vsbseguranca.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cms.vsbseguranca.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.vsbseguranca.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://cms.vsbseguranca.com.br$request_uri;
    }
}
