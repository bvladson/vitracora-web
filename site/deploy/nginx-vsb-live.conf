# Site institucional VSB — proxy reverso para o container Node na 3008.
# Instalar em /etc/nginx/sites-available/vsbseguranca.com.br
#
# Depende de:
#   /etc/nginx/conf.d/vsb-http.conf        ($connection_upgrade)
#   /etc/nginx/snippets/vsb-performance.conf (gzip + brotli)
#
# Os comentários "managed by Certbot" e os caminhos dos certificados são
# preservados de propósito: `certbot renew` substitui só os arquivos de
# certificado, mas um `certbot --nginx` futuro reconhece esta estrutura.

server {
    server_name vsbseguranca.com.br;
    include /etc/nginx/snippets/vsb-performance.conf;

    access_log /var/log/nginx/vsbseguranca-access.log;
    error_log /var/log/nginx/vsbseguranca-error.log;

    client_max_body_size 8m;

    # add_header não é herdado por um location que declare os seus próprios,
    # por isso os cabeçalhos se repetem nos blocos de estáticos abaixo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://tagmanager.google.com https://news.google.com https://www.gstatic.com https://www.google.com https://pagead2.googlesyndication.com https://ep2.adtrafficquality.google ; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://news.google.com https://www.googletagmanager.com https://tagmanager.google.com; img-src 'self' data: https://cms.vsbseguranca.com.br https://*.google-analytics.com https://*.googletagmanager.com https://www.gstatic.com https://ssl.gstatic.com https://*.googleusercontent.com https://www.google.com https://www.google.com.br https://news.google.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://ep1.adtrafficquality.google https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://cms.vsbseguranca.com.br https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://news.google.com https://news.googleusercontent.com https://www.google.com https://www.google.com.br https://www.gstatic.com https://*.googleapis.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://csi.gstatic.com https://ep1.adtrafficquality.google ; frame-src https://www.googletagmanager.com https://news.google.com https://accounts.google.com https://www.google.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://ep2.adtrafficquality.google https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Estáticos com hash no nome. O servidor Node já emite
    # "public, max-age=31536000, immutable" nestes caminhos, então aqui
    # não se toca no cache — acrescentar geraria dois Cache-Control.
    location /assets/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Fontes: nome estável, mas o conteúdo praticamente nunca muda.
    location /fonts/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Estáticos da raiz (public/): antes saíam sem nenhum Cache-Control.
    location ~* ^/[^/]+\.(svg|png|jpg|jpeg|webp|avif|ico|woff2)$ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # nginx 1.24: http2 é parâmetro do listen, não diretiva própria
    # (a diretiva `http2 on;` só existe a partir da 1.25.1).
    # É opção de socket, então basta declarar uma vez por endereço:porta —
    # repetir em outro server block dá "duplicate listen options".
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vsbseguranca.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vsbseguranca.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www → domínio raiz. Antes as duas versões respondiam 200, e só a tag
# canonical evitava a duplicação aos olhos do Google.
server {
    server_name www.vsbseguranca.com.br;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://vsbseguranca.com.br$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vsbseguranca.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vsbseguranca.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name vsbseguranca.com.br www.vsbseguranca.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://vsbseguranca.com.br$request_uri;
    }
}
